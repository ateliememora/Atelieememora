<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memôra Ateliê</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #DDD3BE;
    color: #5D0822;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100dvh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 48px 20px;
  }

  .cartao {
    max-width: clamp(320px, 60vw, 720px);
    width: 100%;
    text-align: center;
  }

  .logo {
    width: 100%;
    margin: 0 auto 28px;
    display: block;
  }

  .foto {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .audio-caixa {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(93, 8, 34, 0.06);
    border-radius: 999px;
    padding: 10px 18px;
  }

  #playBtn {
    background: #5D0822;
    border: none;
    width: 38px;
    height: 38px;
    min-width: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }

  #playBtn svg {
    width: 16px;
    height: 16px;
    fill: #DDD3BE;
  }

  #wave {
    flex: 1;
    height: 40px;
    display: block;
  }
</style>
</head>
<body>

  <div class="cartao">
    <img class="logo" src="../foto.PNG" alt="Memôra Ateliê">

    <img class="foto" src="foto.JPG" onerror="this.onerror=null;this.src='foto.jpg';" alt="Foto especial">

    <div class="audio-caixa">
      <button id="playBtn" aria-label="Tocar áudio">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <canvas id="wave"></canvas>
      <audio id="audio" preload="auto">
        <source src="audio.m4a" type="audio/mp4">
      </audio>
    </div>

    <script>
      const audio = document.getElementById('audio');
      const playBtn = document.getElementById('playBtn');
      const canvas = document.getElementById('wave');
      const ctx = canvas.getContext('2d');

      let audioCtx, analyser, source, dataArray, animId;
      let isPlaying = false;

      function resizeCanvas() {
        canvas.width = canvas.clientWidth * devicePixelRatio;
        canvas.height = canvas.clientHeight * devicePixelRatio;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      function setupAudioGraph() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(audio);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 128;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
      }

      function drawBars(values) {
        const w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#5D0822';
        const barCount = values.length;
        const gap = w / barCount * 0.35;
        const barWidth = (w / barCount) - gap;
        for (let i = 0; i < barCount; i++) {
          const barHeight = Math.max(h * 0.08, values[i] * h);
          const x = i * (barWidth + gap);
          const y = (h - barHeight) / 2;
          ctx.beginPath();
          ctx.roundRect(x, y, barWidth, barHeight, barWidth / 2);
          ctx.fill();
        }
      }

      function staticWave() {
        const bars = 40;
        const values = Array.from({length: bars}, () => 0.15 + Math.random() * 0.15);
        drawBars(values);
      }
      staticWave();

      function animate() {
        analyser.getByteFrequencyData(dataArray);
        const bars = 40;
        const step = Math.floor(dataArray.length / bars);
        const values = [];
        for (let i = 0; i < bars; i++) {
          values.push((dataArray[i * step] / 255) * 0.9 + 0.08);
        }
        drawBars(values);
        animId = requestAnimationFrame(animate);
      }

      playBtn.addEventListener('click', async () => {
        setupAudioGraph();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        if (!isPlaying) {
          audio.play();
          animate();
          playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
        } else {
          audio.pause();
          cancelAnimationFrame(animId);
          playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        }
        isPlaying = !isPlaying;
      });

      audio.addEventListener('ended', () => {
        isPlaying = false;
        cancelAnimationFrame(animId);
        playBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
        staticWave();
      });
    </script>
  </div>

</body>
</html>
