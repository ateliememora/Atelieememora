<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memôra Ateliê</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #DDD3BE;
    color: #5D0822;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .cartao {
    max-width: clamp(320px, 45vw, 480px);
    width: 100%;
    text-align: center;
  }

  .logo {
    width: 100%;
    margin: 0 auto 28px;
    display: block;
  }

  .foto {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }

  .audio-caixa {
    margin-top: 24px;
  }

  audio {
    width: 100%;
    accent-color: #5D0822;
  }
</style>
</head>
<body>

  <div class="cartao">
    <img class="logo" src="../foto.PNG" alt="Memôra Ateliê">

    <img class="foto" src="foto.JPG" onerror="this.onerror=null;this.src='foto.jpg';" alt="Foto especial">

    <div class="audio-caixa">
      <audio controls autoplay>
        <source src="audio.m4a" type="audio/mp4">
        Seu navegador não suporta áudio.
      </audio>
    </div>
  </div>

</body>
</html>
