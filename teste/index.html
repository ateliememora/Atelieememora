<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memôra Ateliê</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #17140f;
    color: #f4ede0;
    font-family: Georgia, 'Times New Roman', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .cartao {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }

  .marca {
    font-size: 14px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #c9a876;
    margin-bottom: 6px;
  }

  .linha {
    width: 40px;
    height: 1px;
    background: #c9a876;
    margin: 14px auto 28px;
  }

  .foto {
    width: 100%;
    aspect-ratio: 4 / 5;
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }

  .mensagem {
    margin-top: 28px;
    font-size: 17px;
    font-style: italic;
    color: #ddd0ba;
    line-height: 1.5;
  }

  .audio-caixa {
    margin-top: 24px;
  }

  audio {
    width: 100%;
    accent-color: #c9a876;
  }

  .rodape {
    margin-top: 36px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6e6455;
  }
</style>
</head>
<body>

  <div class="cartao">
    <div class="marca">Memôra Ateliê</div>
    <div class="linha"></div>

    <img class="foto" src="foto.jpg" alt="Foto especial">

    <p class="mensagem">Onde as lembranças permanecem.</p>

    <div class="audio-caixa">
      <audio controls autoplay>
        <source src="audio.mp3" type="audio/mpeg">
        Seu navegador não suporta áudio.
      </audio>
    </div>

    <div class="rodape">Feito com carinho</div>
  </div>

</body>
</html>
